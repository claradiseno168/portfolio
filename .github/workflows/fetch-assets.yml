name: Fetch assets
# Descarga las imágenes desde Webflow, las optimiza y las guarda en el repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/assets.json', 'tools/fetch-assets.mjs']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save sharp@0.34
      - run: node tools/fetch-assets.mjs
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Add optimized assets from Webflow"
          git push
